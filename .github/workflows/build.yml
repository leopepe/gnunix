# Build images
#
# Per ADR-021: every job runs on free GitHub-hosted runners only.
# The LFS base build runs on `ubuntu-22.04-arm` via chroot,
# split into four cacheable stages to avoid the 6-hour job timeout.
#
# Per ADR-018: `gnunix-minimal` is the release-dependency anchor
# (downstream layers fetch it, not rebuild).
#
# Stage-split pipeline (ADR-021):
#   cross-toolchain   →  temp-tools   →  chroot   →  finalize
#    (~2-3h)           (~1-2h)        (~1-2h)    (~30-60m)
#
# Each stage caches its LFS tree. A cancelled or timed-out job
# resumes from the last completed stage on the next run.
#
# Trigger model:
#   push tag v*     — build all four images + tests + package
#   workflow_dispatch — build selected images (input: images=)
#
# !! STAGED DELIVERY — this is PR-3b.2. !!
#
# Today (PR-3b.1): all four jobs are FETCH jobs. The maintainer publishes
#     `gnunix-{base,minimal,desktop,installer}-<arch>-<ver>.img.zst` to the
#     `gnunix-images-<ver>` GH Release from a Mac (via `tools/release-image.sh
#     <image> --release-tag=gnunix-images-<ver>`) before pushing the `v<ver>`
#   tag. CI fetches and re-uploads.
#
# Next (PR-3b.2): the `gnunix-base` job becomes a real build.
#   The LFS stages (cross-toolchain, temp-tools, chroot, finalize)
#   run on `ubuntu-22.04-arm` via chroot. The downstream jobs
#   (fetch-minimal, fetch-desktop, fetch-installer) pivot from
#   FETCH to true rebuild — layering on the fetched `gnunix-minimal`.
#   The `package` and `installer-test` matrices come back at the same time.

name: Build images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      images:
        description: "Comma-separated list (gnunix-base, gnunix-minimal, gnunix-desktop, gnunix-installer)"
        required: false
        default: "gnunix-base,gnunix-minimal,gnunix-desktop,gnunix-installer"

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  REPO_ROOT: /home/runner/work/gnunix/gnunix
  LFS: /mnt/lfs
  SOURCES: /mnt/lfs/sources

jobs:
    # Resolve version + arch once, share via artifacts.
  meta:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      version: ${{ steps.r.outputs.version }}
      arch:     ${{ steps.r.outputs.arch }}
      gnunix_images_tag: ${{ steps.r.outputs.gnunix_images_tag }}
    steps:
       - uses: actions/checkout@v4
       - id: r
         run: |
          set -eu
          v=$(jq -r .lfs_image_version "$REPO_ROOT/tools/manifest.json")
          a=$(jq -r '.active_arch // .target_arch' "$REPO_ROOT/tools/manifest.json")
           {
            echo "version=$v"
            echo "arch=$a"
            echo "gnunix_images_tag=gnunix-images-$v"
           } >> "$GITHUB_OUTPUT"

    # === gnunix-base: stage-split LFS build ===
    #
    # Per ADR-021: the LFS build runs on `ubuntu-22.04-arm` via chroot.
    # Split into four cacheable stages to avoid the 6-hour job timeout.
    # Each stage caches its LFS tree; a cancelled job resumes from
    # the last completed stage on the next run.
    #
    # Cache strategy: each stage has a cache key that includes the
    # version and a hash of the stage script. When a script changes,
    # its cache key changes, forcing a rebuild. A `restore-keys` prefix
    # falls back to the previous stage's cache if the exact key misses.
    #
    # LFS tree size: measured at 801 MB after cross-toolchain (run
    # 34705000776), well inside GitHub's 10 GB per-cache limit — the
    # 5-10 GB / 15-25 GB figures previously written here were never
    # measured. Each stage's restore-keys fall back down the chain
    # (chroot -> temp -> cross), so a script edit that misses the exact
    # key still restores the previous stage's tree instead of starting
    # empty, and --ci refuses to run a stage whose predecessor marker
    # is absent.

  cross-toolchain:
    needs: meta
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 240
    if: |
      github.event_name != 'workflow_dispatch' ||
      contains(github.event.inputs.images, 'gnunix-base')
    steps:
       - uses: actions/checkout@v4
       - name: Compute cache key
         id: cachekey
         run: |
          set -eu
          VER="${{ needs.meta.outputs.version }}"
          HASH=$(sha256sum images/gnunix-base/stages/01-cross-toolchain.sh | awk '{print $1}')
          echo "key=lfs-cross-${VER}-${HASH}" >> "$GITHUB_OUTPUT"
          echo "restore=lfs-cross-${VER}-" >> "$GITHUB_OUTPUT"
       - name: Restore LFS cache
         uses: actions/cache/restore@v4
         with:
          key: ${{ steps.cachekey.outputs.key }}
          restore-keys: ${{ steps.cachekey.outputs.restore }}
            # A workspace file, not $LFS itself: actions/cache runs as the
            # unprivileged runner and cannot write under root-owned /mnt,
            # nor restore the tree's ownership. See scripts/ci-lfs-cache.sh.
          path: cache/lfs-tree.tzst
       - name: Unpack the LFS tree
         run: sudo scripts/ci-lfs-cache.sh unpack cache/lfs-tree.tzst
       - name: Create the LFS tree
         run: |
          set -eu
            # $LFS is the LFS tree being BUILT, not a distro rootfs. Stage 1
            # cross-compiles into $LFS/tools using the runner's own gcc, per
            # the LFS book ch. 4-5. The previous step downloaded a cirruslabs
            # Ubuntu rootfs from a URL that 404s, and cirruslabs ships Tart
            # OCI images rather than rootfs tarballs, so there was nothing to
            # point it at.
          sudo mkdir -p "$LFS" "$SOURCES"
          sudo chmod 755 "$LFS"
       - name: Install LFS host build dependencies
         run: sudo scripts/install-build-deps.sh
       - name: Build stage 'cross'
         run: |
          set -eu
            # build.sh --ci owns the environment (LFS_TGT, LC_ALL, PATH),
            # runs tools/fetch-sources.sh first, and honours the
            # $LFS/.lfs-stages/*.done markers. Calling the stage script
            # directly skipped all of that.
          sudo bash images/gnunix-base/build.sh --ci --only=cross
       - name: Pack the LFS tree
         run: sudo scripts/ci-lfs-cache.sh pack cache/lfs-tree.tzst
       - name: Save LFS cache
         uses: actions/cache/save@v4
         if: steps.cachekey.outputs.key != ''
         with:
          key: ${{ steps.cachekey.outputs.key }}
          path: cache/lfs-tree.tzst

  temp-tools:
    needs: [meta, cross-toolchain]
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 180
    if: |
      github.event_name != 'workflow_dispatch' ||
      contains(github.event.inputs.images, 'gnunix-base')
    steps:
       - uses: actions/checkout@v4
       - name: Compute cache key
         id: cachekey
         run: |
          set -eu
          VER="${{ needs.meta.outputs.version }}"
          HASH=$(sha256sum images/gnunix-base/stages/02-temp-tools.sh | awk '{print $1}')
          echo "key=lfs-temp-${VER}-${HASH}" >> "$GITHUB_OUTPUT"
            # Fall back to the PREVIOUS stage's tree, not just this stage's.
            # With only the lfs-temp- prefix, the very first run of this job
            # always missed (nothing had ever saved an lfs-temp- key) and
            # started from an empty $LFS.
          {
            echo "restore<<EOF"
            echo "lfs-temp-${VER}-"
            echo "lfs-cross-${VER}-"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
       - name: Restore LFS cache
         uses: actions/cache/restore@v4
         with:
          key: ${{ steps.cachekey.outputs.key }}
          restore-keys: ${{ steps.cachekey.outputs.restore }}
            # A workspace file, not $LFS itself: actions/cache runs as the
            # unprivileged runner and cannot write under root-owned /mnt,
            # nor restore the tree's ownership. See scripts/ci-lfs-cache.sh.
          path: cache/lfs-tree.tzst
       - name: Unpack the LFS tree
         run: sudo scripts/ci-lfs-cache.sh unpack cache/lfs-tree.tzst
       - name: Install LFS host build dependencies
         run: sudo scripts/install-build-deps.sh
       - name: Build stage 'temp-tools'
         run: |
          set -eu
            # build.sh --ci owns the environment (LFS_TGT, LC_ALL, PATH),
            # runs tools/fetch-sources.sh first, and honours the
            # $LFS/.lfs-stages/*.done markers. Calling the stage script
            # directly skipped all of that.
          sudo bash images/gnunix-base/build.sh --ci --only=temp-tools
       - name: Pack the LFS tree
         run: sudo scripts/ci-lfs-cache.sh pack cache/lfs-tree.tzst
       - name: Save LFS cache
         uses: actions/cache/save@v4
         if: steps.cachekey.outputs.key != ''
         with:
          key: ${{ steps.cachekey.outputs.key }}
          path: cache/lfs-tree.tzst

  chroot:
    needs: [meta, temp-tools]
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 180
    if: |
      github.event_name != 'workflow_dispatch' ||
      contains(github.event.inputs.images, 'gnunix-base')
    steps:
       - uses: actions/checkout@v4
       - name: Compute cache key
         id: cachekey
         run: |
          set -eu
          VER="${{ needs.meta.outputs.version }}"
          HASH=$(sha256sum images/gnunix-base/stages/03-chroot.sh | awk '{print $1}')
          echo "key=lfs-chroot-${VER}-${HASH}" >> "$GITHUB_OUTPUT"
            # Ordered fallback down the stage chain (see temp-tools above).
          {
            echo "restore<<EOF"
            echo "lfs-chroot-${VER}-"
            echo "lfs-temp-${VER}-"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
       - name: Restore LFS cache
         uses: actions/cache/restore@v4
         with:
          key: ${{ steps.cachekey.outputs.key }}
          restore-keys: ${{ steps.cachekey.outputs.restore }}
            # A workspace file, not $LFS itself: actions/cache runs as the
            # unprivileged runner and cannot write under root-owned /mnt,
            # nor restore the tree's ownership. See scripts/ci-lfs-cache.sh.
          path: cache/lfs-tree.tzst
       - name: Unpack the LFS tree
         run: sudo scripts/ci-lfs-cache.sh unpack cache/lfs-tree.tzst
       - name: Install LFS host build dependencies
         run: sudo scripts/install-build-deps.sh
       - name: Build stage 'chroot'
         run: |
          set -eu
            # build.sh --ci owns the environment (LFS_TGT, LC_ALL, PATH),
            # runs tools/fetch-sources.sh first, and honours the
            # $LFS/.lfs-stages/*.done markers. Calling the stage script
            # directly skipped all of that.
          sudo bash images/gnunix-base/build.sh --ci --only=chroot
       - name: Pack the LFS tree
         run: sudo scripts/ci-lfs-cache.sh pack cache/lfs-tree.tzst
       - name: Save LFS cache
         uses: actions/cache/save@v4
         if: steps.cachekey.outputs.key != ''
         with:
          key: ${{ steps.cachekey.outputs.key }}
          path: cache/lfs-tree.tzst

  finalize:
    needs: [meta, chroot]
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 120
    if: |
      github.event_name != 'workflow_dispatch' ||
      contains(github.event.inputs.images, 'gnunix-base')
    steps:
       - uses: actions/checkout@v4
       - name: Restore LFS cache
         uses: actions/cache/restore@v4
         with:
          key: lfs-chroot-${{ needs.meta.outputs.version }}-
          restore-keys: lfs-chroot-${{ needs.meta.outputs.version }}-
            # See scripts/ci-lfs-cache.sh: the cache holds a root-written
            # tarball, not $LFS, so ownership survives the round trip.
          path: cache/lfs-tree.tzst
       - name: Unpack the LFS tree
         run: sudo scripts/ci-lfs-cache.sh unpack cache/lfs-tree.tzst
       - name: Install LFS host build dependencies
         run: sudo scripts/install-build-deps.sh
       - name: Finalize rootfs
         run: |
          set -eu
          sudo bash images/gnunix-base/build.sh --ci --only=finalize
       - name: Build and compress disk image
         run: |
          set -eu
            # --only=package runs packaging/mkimage.sh (which writes
            # $LFS/../gnunix-base-disk.img) and then compresses it to the
            # canonical cache/artifacts/ name. The previous version never
            # invoked mkimage.sh at all and compressed a file that the
            # finalize stage does not create.
          sudo bash images/gnunix-base/build.sh --ci --only=package
          ls -lh cache/artifacts/
       - name: Upload base artifact
         uses: actions/upload-artifact@v4
         with:
          name: gnunix-base-${{ needs.meta.outputs.arch }}-${{ needs.meta.outputs.version }}
          path: cache/artifacts/gnunix-base-${{ needs.meta.outputs.arch }}-${{ needs.meta.outputs.version }}.img.zst
          if-no-files-found: error
          retention-days: ${{ startsWith(github.ref, 'refs/tags/v') && 90 || 30 }}

    # === Downstream images ===
    # Per ADR-018: gnunix-minimal is the release-dependency anchor.
    # Downstream layers fetch it, they do not rebuild it.

  build-minimal:
    needs: [meta, finalize]
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 30
    if: |
      github.event_name != 'workflow_dispatch' ||
      contains(github.event.inputs.images, 'gnunix-minimal')
    steps:
       - uses: actions/checkout@v4
       - name: Download base image
         uses: actions/download-artifact@v4
         with:
          name: gnunix-base-${{ needs.meta.outputs.arch }}-${{ needs.meta.outputs.version }}
          path: cache/artifacts/
       - name: Build gnunix-minimal
         run: |
          sudo bash images/gnunix-minimal/build.sh --ci
       - name: Compress + upload
         run: |
          set -eu
          VER="${{ needs.meta.outputs.version }}"
          ARCH="${{ needs.meta.outputs.arch }}"
          OUT="$REPO_ROOT/cache/artifacts"
          mkdir -p "$OUT"
          zstd -10 -f -k "$OUT/gnunix-minimal-${ARCH}-${VER}.img" \
              -o "$OUT/gnunix-minimal-${ARCH}-${VER}.img.zst"
       - name: Upload minimal artifact
         uses: actions/upload-artifact@v4
         with:
          name: gnunix-minimal-${{ needs.meta.outputs.arch }}-${{ needs.meta.outputs.version }}
          path: cache/artifacts/gnunix-minimal-${{ needs.meta.outputs.arch }}-${{ needs.meta.outputs.version }}.img.zst
          if-no-files-found: error
          retention-days: ${{ startsWith(github.ref, 'refs/tags/v') && 90 || 30 }}

  build-desktop:
    needs: [meta, build-minimal]
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 30
    if: |
      github.event_name != 'workflow_dispatch' ||
      contains(github.event.inputs.images, 'gnunix-desktop')
    steps:
       - uses: actions/checkout@v4
       - name: Download minimal image
         uses: actions/download-artifact@v4
         with:
          name: gnunix-minimal-${{ needs.meta.outputs.arch }}-${{ needs.meta.outputs.version }}
          path: cache/artifacts/
       - name: Build gnunix-desktop
         run: |
          sudo bash images/gnunix-desktop/build.sh --ci
       - name: Compress + upload
         run: |
          set -eu
          VER="${{ needs.meta.outputs.version }}"
          ARCH="${{ needs.meta.outputs.arch }}"
          OUT="$REPO_ROOT/cache/artifacts"
          mkdir -p "$OUT"
          zstd -10 -f -k "$OUT/gnunix-desktop-${ARCH}-${VER}.img" \
              -o "$OUT/gnunix-desktop-${ARCH}-${VER}.img.zst"
       - name: Upload desktop artifact
         uses: actions/upload-artifact@v4
         with:
          name: gnunix-desktop-${{ needs.meta.outputs.arch }}-${{ needs.meta.outputs.version }}
          path: cache/artifacts/gnunix-desktop-${{ needs.meta.outputs.arch }}-${{ needs.meta.outputs.version }}.img.zst
          if-no-files-found: error
          retention-days: ${{ startsWith(github.ref, 'refs/tags/v') && 90 || 30 }}

  build-installer:
    needs: [meta, build-minimal]
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 30
    if: |
      github.event_name != 'workflow_dispatch' ||
      contains(github.event.inputs.images, 'gnunix-installer')
    continue-on-error: true
    steps:
       - uses: actions/checkout@v4
       - name: Download minimal image
         uses: actions/download-artifact@v4
         with:
          name: gnunix-minimal-${{ needs.meta.outputs.arch }}-${{ needs.meta.outputs.version }}
          path: cache/artifacts/
       - name: Build gnunix-installer
         run: |
          sudo bash images/installer/build.sh --ci
       - name: Compress + upload
         run: |
          set -eu
          VER="${{ needs.meta.outputs.version }}"
          ARCH="${{ needs.meta.outputs.arch }}"
          OUT="$REPO_ROOT/cache/artifacts"
          mkdir -p "$OUT"
            # Installer ships as hybrid ISO
          zstd -10 -f -k "$OUT/gnunix-installer-${ARCH}-${VER}.iso" \
              -o "$OUT/gnunix-installer-${ARCH}-${VER}.iso.zst"
       - name: Upload installer artifact
         uses: actions/upload-artifact@v4
         if: always()
         with:
          name: gnunix-installer-${{ needs.meta.outputs.arch }}-${{ needs.meta.outputs.version }}
          path: |
            cache/artifacts/gnunix-installer-${{ needs.meta.outputs.arch }}-${{ needs.meta.outputs.version }}.iso
            cache/artifacts/gnunix-installer-${{ needs.meta.outputs.arch }}-${{ needs.meta.outputs.version }}.iso.zst
          if-no-files-found: ignore
          retention-days: ${{ startsWith(github.ref, 'refs/tags/v') && 90 || 30 }}

    # === Smoke tests ===
    # Per ADR-016 / ADR-021: tests run on `ubuntu-22.04-arm` via
    # qemu+KVM through `scripts/vm-helpers.sh`.

  test-base:
    needs: [meta, finalize]
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 15
    steps:
       - uses: actions/checkout@v4
       - name: Download base image
         uses: actions/download-artifact@v4
         with:
          name: gnunix-base-${{ needs.meta.outputs.arch }}-${{ needs.meta.outputs.version }}
          path: cache/artifacts/
       - name: Boot smoke test
         run: |
          set -eu
            # The smoke test script uses vm-helpers.sh (qemu driver in CI)
          export VER="${{ needs.meta.outputs.version }}"
          ARCH="${{ needs.meta.outputs.arch }}"
            # Import the image for qemu
          zstd -d -c "cache/artifacts/gnunix-base-${ARCH}-${VER}.img.zst" \
              | sudo dd of=cache/artifacts/base-test.img bs=4M status=suppress
            # Run the smoke test (qemu driver via vm-helpers.sh)
          GNUNIX_IMAGE=cache/artifacts/base-test.img \
            bash tests/base/boot-smoke.sh gnunix-base-$VER

  test-minimal:
    needs: [meta, build-minimal]
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 15
    steps:
       - uses: actions/checkout@v4
       - name: Download minimal image
         uses: actions/download-artifact@v4
         with:
          name: gnunix-minimal-${{ needs.meta.outputs.arch }}-${{ needs.meta.outputs.version }}
          path: cache/artifacts/
       - name: Boot smoke test
         run: |
          set -eu
          export VER="${{ needs.meta.outputs.version }}"
          ARCH="${{ needs.meta.outputs.arch }}"
          zstd -d -c "cache/artifacts/gnunix-minimal-${ARCH}-${VER}.img.zst" \
              | sudo dd of=cache/artifacts/minimal-test.img bs=4M status=suppress
          GNUNIX_IMAGE=cache/artifacts/minimal-test.img \
            bash tests/minimal/minimal-smoke.sh gnunix-minimal-$VER

  test-desktop:
    needs: [meta, build-desktop]
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 15
    steps:
       - uses: actions/checkout@v4
       - name: Download desktop image
         uses: actions/download-artifact@v4
         with:
          name: gnunix-desktop-${{ needs.meta.outputs.arch }}-${{ needs.meta.outputs.version }}
          path: cache/artifacts/
       - name: Wayland session test
         run: |
          set -eu
          export VER="${{ needs.meta.outputs.version }}"
          ARCH="${{ needs.meta.outputs.arch }}"
          zstd -d -c "cache/artifacts/gnunix-desktop-${ARCH}-${VER}.img.zst" \
              | sudo dd of=cache/artifacts/desktop-test.img bs=4M status=suppress
          GNUNIX_IMAGE=cache/artifacts/desktop-test.img \
            bash tests/desktop/wayland-session.sh gnunix-desktop-$VER

    # === Package matrix ===
    # Per ADR-018: produce the published artifact forms.

  package:
    # Must wait for the images it repackages: `needs: meta` alone let this
    # job start immediately, so download-artifact raced the build jobs.
    needs: [meta, build-minimal, build-desktop]
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 15
    strategy:
      matrix:
        include:
           - image: gnunix-minimal
             arch: aarch64
             platform: generic-uefi
             output_format: img.zst
           - image: gnunix-desktop
             arch: aarch64
             platform: generic-uefi
             output_format: img.zst
    steps:
       - uses: actions/checkout@v4
       - name: Download image
         uses: actions/download-artifact@v4
         with:
          name: ${{ matrix.image }}-${{ matrix.arch }}-${{ needs.meta.outputs.version }}
          path: cache/artifacts/
       - name: Decompress to raw .img
         run: |
          set -eu
            # tools/package/to-img-zst.sh reads the RAW disk image at
            # cache/artifacts/<image>-<arch>-<ver>.img; the build jobs
            # publish the compressed form, so expand it here.
          VER="${{ needs.meta.outputs.version }}"
          ARCH="${{ matrix.arch }}"
          SRC="cache/artifacts/${{ matrix.image }}-${ARCH}-${VER}"
          zstd -d -f "${SRC}.img.zst" -o "${SRC}.img"
       - name: Package
         run: |
          set -eu
          tools/package.sh "${{ matrix.image }}" \
              --arch=${{ matrix.arch }} \
              --platform=${{ matrix.platform }} \
              --as=${{ matrix.output_format }}
       - name: Upload package artifact
         uses: actions/upload-artifact@v4
         with:
          name: package-${{ matrix.image }}-${{ matrix.arch }}-${{ matrix.platform }}
            # Narrow to the packaged form only. Globbing the whole
            # cache/artifacts/ dir also swept up the decompressed raw
            # .img (multi-GB) and the downloaded input artifact.
          path: cache/artifacts/${{ matrix.image }}-${{ matrix.arch }}-${{ needs.meta.outputs.version }}.${{ matrix.output_format }}
          if-no-files-found: error
          retention-days: ${{ startsWith(github.ref, 'refs/tags/v') && 90 || 30 }}
