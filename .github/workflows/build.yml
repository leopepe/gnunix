# Build images
#
# Per ADR-021: every job runs on free GitHub-hosted runners only.
# The LFS base build runs on `ubuntu-22.04-arm` via chroot,
# split into four cacheable stages to avoid the 6-hour job timeout.
#
# Per ADR-018: `gnunix-minimal` is the release-dependency anchor
# (downstream layers fetch it, not rebuild).
#
# Stage-split pipeline (ADR-021):
#   cross-toolchain   →  temp-tools   →  chroot   →  finalize
#    (~2-3h)           (~1-2h)        (~1-2h)    (~30-60m)
#
# Each stage caches its LFS tree. A cancelled or timed-out job
# resumes from the last completed stage on the next run.
#
# Trigger model:
#   push tag v*     — build all four images + tests + package
#   workflow_dispatch — build selected images (input: images=)
#
# !! STAGED DELIVERY — this is PR-3b.2. !!
#
# Today (PR-3b.1): all four jobs are FETCH jobs. The maintainer publishes
#     `gnunix-{base,minimal,desktop,installer}-<arch>-<ver>.img.zst` to the
#     `gnunix-images-<ver>` GH Release from a Mac (via `tools/release-image.sh
#     <image> --release-tag=gnunix-images-<ver>`) before pushing the `v<ver>`
#   tag. CI fetches and re-uploads.
#
# Next (PR-3b.2): the `gnunix-base` job becomes a real build.
#   The LFS stages (cross-toolchain, temp-tools, chroot, finalize)
#   run on `ubuntu-22.04-arm` via chroot. The downstream jobs
#   (fetch-minimal, fetch-desktop, fetch-installer) pivot from
#   FETCH to true rebuild — layering on the fetched `gnunix-minimal`.
#   The `package` and `installer-test` matrices come back at the same time.

name: Build images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      images:
        description: "Comma-separated list (gnunix-base, gnunix-minimal, gnunix-desktop, gnunix-installer)"
        required: false
        default: "gnunix-base,gnunix-minimal,gnunix-desktop,gnunix-installer"

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  REPO_ROOT: /home/runner/work/gnunix/gnunix
  LFS: /mnt/lfs
  SOURCES: /mnt/lfs/sources

jobs:
    # Resolve version + arch once, share via artifacts.
  meta:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      version: ${{ steps.r.outputs.version }}
      arch:     ${{ steps.r.outputs.arch }}
      gnunix_images_tag: ${{ steps.r.outputs.gnunix_images_tag }}
    steps:
       - uses: actions/checkout@v4
       - id: r
         run: |
          set -eu
          v=$(jq -r .lfs_image_version "$REPO_ROOT/tools/manifest.json")
          a=$(jq -r '.active_arch // .target_arch' "$REPO_ROOT/tools/manifest.json")
           {
            echo "version=$v"
            echo "arch=$a"
            echo "gnunix_images_tag=gnunix-images-$v"
           } >> "$GITHUB_OUTPUT"

    # === gnunix-base: stage-split LFS build ===
    #
    # Per ADR-021: the LFS build runs on `ubuntu-22.04-arm` via chroot.
    # Split into four cacheable stages to avoid the 6-hour job timeout.
    # Each stage caches its LFS tree; a cancelled job resumes from
    # the last completed stage on the next run.
    #
    # Cache strategy: each stage has a cache key that includes the
    # version and a hash of the stage script. When a script changes,
    # its cache key changes, forcing a rebuild. A `restore-keys` prefix
    # falls back to the previous stage's cache if the exact key misses.
    #
    # LFS tree size: measured at 801 MB after cross-toolchain (run
    # 34705000776), well inside GitHub's 10 GB per-cache limit — the
    # 5-10 GB / 15-25 GB figures previously written here were never
    # measured. Each stage's restore-keys fall back down the chain
    # (chroot -> temp -> cross), so a script edit that misses the exact
    # key still restores the previous stage's tree instead of starting
    # empty, and --ci refuses to run a stage whose predecessor marker
    # is absent.

  cross-toolchain:
    needs: meta
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 240
    if: |
      github.event_name != 'workflow_dispatch' ||
      contains(github.event.inputs.images, 'gnunix-base')
    steps:
       - uses: actions/checkout@v4
       - name: Compute cache key
         id: cachekey
         run: |
          set -eu
          VER="${{ needs.meta.outputs.version }}"
          HASH=$(sha256sum images/gnunix-base/stages/01-cross-toolchain.sh | awk '{print $1}')
          echo "key=lfs-cross-${VER}-${HASH}" >> "$GITHUB_OUTPUT"
            # No restore-keys at all. This is the first stage, so there is
            # no predecessor to inherit from, and a lfs-cross- prefix
            # fallback would restore a tree built by a DIFFERENT version of
            # 01-cross-toolchain.sh while the .lfs-stages marker inside it
            # claims the stage is done. An edited stage script must rebuild.
          echo "restore=" >> "$GITHUB_OUTPUT"
       - name: Restore LFS cache
         uses: actions/cache/restore@v4
         with:
          key: ${{ steps.cachekey.outputs.key }}
          restore-keys: ${{ steps.cachekey.outputs.restore }}
            # A workspace file, not $LFS itself: actions/cache runs as the
            # unprivileged runner and cannot write under root-owned /mnt,
            # nor restore the tree's ownership. See scripts/ci-lfs-cache.sh.
          path: cache/lfs-tree.tzst
       - name: Unpack the LFS tree
         run: sudo scripts/ci-lfs-cache.sh unpack cache/lfs-tree.tzst
       - name: Create the LFS tree
         run: |
          set -eu
            # $LFS is the LFS tree being BUILT, not a distro rootfs. Stage 1
            # cross-compiles into $LFS/tools using the runner's own gcc, per
            # the LFS book ch. 4-5. The previous step downloaded a cirruslabs
            # Ubuntu rootfs from a URL that 404s, and cirruslabs ships Tart
            # OCI images rather than rootfs tarballs, so there was nothing to
            # point it at.
          sudo mkdir -p "$LFS" "$SOURCES"
          sudo chmod 755 "$LFS"
       - name: Install LFS host build dependencies
         run: sudo scripts/install-build-deps.sh
       - name: Build stage 'cross'
         run: |
          set -eu
            # build.sh --ci owns the environment (LFS_TGT, LC_ALL, PATH),
            # runs tools/fetch-sources.sh first, and honours the
            # $LFS/.lfs-stages/*.done markers. Calling the stage script
            # directly skipped all of that.
          sudo bash images/gnunix-base/build.sh --ci --only=cross
       - name: Pack the LFS tree
         run: sudo scripts/ci-lfs-cache.sh pack cache/lfs-tree.tzst
       - name: Save LFS cache
         uses: actions/cache/save@v4
         if: steps.cachekey.outputs.key != ''
         with:
          key: ${{ steps.cachekey.outputs.key }}
          path: cache/lfs-tree.tzst

  temp-tools:
    needs: [meta, cross-toolchain]
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 180
    if: |
      github.event_name != 'workflow_dispatch' ||
      contains(github.event.inputs.images, 'gnunix-base')
    steps:
       - uses: actions/checkout@v4
       - name: Compute cache key
         id: cachekey
         run: |
          set -eu
          VER="${{ needs.meta.outputs.version }}"
          HASH=$(sha256sum images/gnunix-base/stages/02-temp-tools.sh | awk '{print $1}')
          echo "key=lfs-temp-${VER}-${HASH}" >> "$GITHUB_OUTPUT"
            # Fall back ONLY to PREVIOUS stages, never to an older build of
            # this same stage. A self-prefix fallback (lfs-temp-${VER}-) is
            # what poisoned main: the exact key missed, the prefix matched a
            # pre-fix tree, that tree carried .lfs-stages/temp-tools.done, so
            # the stage built nothing -- and then re-saved the stale tree
            # under the CURRENT scripts' hash. One key, two different trees.
          {
            echo "restore<<EOF"
            echo "lfs-cross-${VER}-"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
       - name: Restore LFS cache
         uses: actions/cache/restore@v4
         with:
          key: ${{ steps.cachekey.outputs.key }}
          restore-keys: ${{ steps.cachekey.outputs.restore }}
            # A workspace file, not $LFS itself: actions/cache runs as the
            # unprivileged runner and cannot write under root-owned /mnt,
            # nor restore the tree's ownership. See scripts/ci-lfs-cache.sh.
          path: cache/lfs-tree.tzst
       - name: Unpack the LFS tree
         run: sudo scripts/ci-lfs-cache.sh unpack cache/lfs-tree.tzst
       - name: Install LFS host build dependencies
         run: sudo scripts/install-build-deps.sh
       - name: Build stage 'temp-tools'
         run: |
          set -eu
            # build.sh --ci owns the environment (LFS_TGT, LC_ALL, PATH),
            # runs tools/fetch-sources.sh first, and honours the
            # $LFS/.lfs-stages/*.done markers. Calling the stage script
            # directly skipped all of that.
          sudo bash images/gnunix-base/build.sh --ci --only=temp-tools
       - name: Pack the LFS tree
         run: sudo scripts/ci-lfs-cache.sh pack cache/lfs-tree.tzst
       - name: Save LFS cache
         uses: actions/cache/save@v4
         if: steps.cachekey.outputs.key != ''
         with:
          key: ${{ steps.cachekey.outputs.key }}
          path: cache/lfs-tree.tzst

  chroot:
    needs: [meta, temp-tools]
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 180
    if: |
      github.event_name != 'workflow_dispatch' ||
      contains(github.event.inputs.images, 'gnunix-base')
    steps:
       - uses: actions/checkout@v4
       - name: Compute cache key
         id: cachekey
         run: |
          set -eu
          VER="${{ needs.meta.outputs.version }}"
            # Hash BOTH chroot scripts. 03-chroot.sh only sets up the
            # mounts and staging; every package the stage actually builds
            # lives in 03b-chroot-inner.sh. Keying on 03-chroot.sh alone
            # meant an edit to the package list did not invalidate the
            # cache — and because the restored tree carries the
            # /var/lib/lfs-pkgs/*.done markers, pkg_skip would then skip
            # the very package that was just added or changed. The perl
            # fix in 6a5f14b is exactly that shape.
          HASH=$(cat images/gnunix-base/stages/03-chroot.sh \
                     images/gnunix-base/stages/03b-chroot-inner.sh \
                 | sha256sum | awk '{print $1}')
          echo "key=lfs-chroot-${VER}-${HASH}" >> "$GITHUB_OUTPUT"
            # Previous stages only -- no lfs-chroot- self-fallback. The
            # comment above explains why a stale tree is dangerous here:
            # its /var/lib/lfs-pkgs/*.done markers make pkg_skip skip the
            # very packages an edit just changed. A self-prefix fallback
            # reintroduces exactly that, one cache generation later.
          {
            echo "restore<<EOF"
            echo "lfs-temp-${VER}-"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
       - name: Restore LFS cache
         uses: actions/cache/restore@v4
         with:
          key: ${{ steps.cachekey.outputs.key }}
          restore-keys: ${{ steps.cachekey.outputs.restore }}
            # A workspace file, not $LFS itself: actions/cache runs as the
            # unprivileged runner and cannot write under root-owned /mnt,
            # nor restore the tree's ownership. See scripts/ci-lfs-cache.sh.
          path: cache/lfs-tree.tzst
       - name: Unpack the LFS tree
         run: sudo scripts/ci-lfs-cache.sh unpack cache/lfs-tree.tzst
       - name: Install LFS host build dependencies
         run: sudo scripts/install-build-deps.sh
       - name: Build stage 'chroot'
         run: |
          set -eu
            # build.sh --ci owns the environment (LFS_TGT, LC_ALL, PATH),
            # runs tools/fetch-sources.sh first, and honours the
            # $LFS/.lfs-stages/*.done markers. Calling the stage script
            # directly skipped all of that.
          sudo bash images/gnunix-base/build.sh --ci --only=chroot
       - name: Pack the LFS tree
         run: sudo scripts/ci-lfs-cache.sh pack cache/lfs-tree.tzst
       - name: Save LFS cache
         uses: actions/cache/save@v4
         if: steps.cachekey.outputs.key != ''
         with:
          key: ${{ steps.cachekey.outputs.key }}
          path: cache/lfs-tree.tzst

  finalize:
    needs: [meta, chroot]
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 120
    if: |
      github.event_name != 'workflow_dispatch' ||
      contains(github.event.inputs.images, 'gnunix-base')
    steps:
       - uses: actions/checkout@v4
       - name: Compute cache key
         id: cachekey
         run: |
          set -eu
          VER="${{ needs.meta.outputs.version }}"
            # This stage is dominated by the kernel build: 983s of its
            # 1088s on run 34748680280. Caching its output turns every
            # downstream debug cycle from ~18 min into ~30s.
            #
            # Key on everything that changes what the stage produces: the
            # stage script, both kernel config fragments, the pinned kernel
            # version -- and every file the stage INSTALLS. Miss any of them
            # and a bumped kernel would silently reuse the old vmlinuz.
            #
            # The installed files were the gap. 04-finalize.sh copies
            # images/gnunix-base/etc/** (inittab, profile, fstab.template,
            # hostname, resolv.conf.tpl, syslog.conf, logrotate.conf,
            # logrotate.d/*, cron.d/*, and all 13 rc.d scripts) plus
            # grub.cfg into the tree. Editing any of them left this key
            # unchanged, so the job took an exact cache hit, run_stage saw
            # .lfs-stages/finalize.done in the restored tree and skipped the
            # stage outright -- and the image shipped the OLD copy with no
            # error anywhere. Same failure shape as #146, one directory over.
            #
            # sha256sum (not cat) so a rename or a move changes the key too:
            # the path is part of each line.
          HASH=$( { cat images/gnunix-base/stages/04-finalize.sh \
                        images/gnunix-base/kernel.config \
                        images/gnunix-base/kernel.modules.config
                    find images/gnunix-base/etc -type f -print0 \
                      | sort -z | xargs -0 sha256sum
                    sha256sum images/gnunix-base/grub.cfg
                    jq -r .kernel.version tools/manifest.json
                  } | sha256sum | awk '{print $1}')
          echo "key=lfs-final-${VER}-${HASH}" >> "$GITHUB_OUTPUT"
            # Predecessor only, never lfs-final- -- a self-prefix fallback
            # would restore a tree whose .lfs-stages/finalize.done makes
            # this stage skip the very work an edit just changed. See #146.
          echo "restore=lfs-chroot-${VER}-" >> "$GITHUB_OUTPUT"
       - name: Restore LFS cache
         id: restore
         uses: actions/cache/restore@v4
         with:
          key: ${{ steps.cachekey.outputs.key }}
          restore-keys: ${{ steps.cachekey.outputs.restore }}
            # See scripts/ci-lfs-cache.sh: the cache holds a root-written
            # tarball, not $LFS, so ownership survives the round trip.
          path: cache/lfs-tree.tzst
       - name: Unpack the LFS tree
         run: sudo scripts/ci-lfs-cache.sh unpack cache/lfs-tree.tzst
       - name: Install LFS host build dependencies
         run: sudo scripts/install-build-deps.sh
       - name: Finalize rootfs
         run: |
          set -eu
            # A no-op when the cache hit was exact: the restored tree
            # carries .lfs-stages/finalize.done and run_stage skips it.
          sudo bash images/gnunix-base/build.sh --ci --only=finalize
         # Repacking an exact hit would re-tar ~1.5 GB to produce a blob
         # the cache already holds under this key. The earlier stages pack
         # unconditionally; this one is the largest tree, so it is worth
         # the extra condition.
       - name: Pack the LFS tree
         if: steps.restore.outputs.cache-hit != 'true'
         run: sudo scripts/ci-lfs-cache.sh pack cache/lfs-tree.tzst
       - name: Save LFS cache
         if: steps.restore.outputs.cache-hit != 'true'
         uses: actions/cache/save@v4
         with:
          key: ${{ steps.cachekey.outputs.key }}
          path: cache/lfs-tree.tzst
       - name: Build and compress disk image
         run: |
          set -eu
            # --only=package runs packaging/mkimage.sh (which writes
            # $LFS/../gnunix-base-disk.img) and then compresses it to the
            # canonical cache/artifacts/ name. The previous version never
            # invoked mkimage.sh at all and compressed a file that the
            # finalize stage does not create.
          sudo bash images/gnunix-base/build.sh --ci --only=package
          ls -lh cache/artifacts/
       - name: Upload base artifact
         uses: actions/upload-artifact@v4
         with:
          name: gnunix-base-${{ needs.meta.outputs.arch }}-${{ needs.meta.outputs.version }}
          path: cache/artifacts/gnunix-base-${{ needs.meta.outputs.arch }}-${{ needs.meta.outputs.version }}.img.zst
          if-no-files-found: error
          retention-days: ${{ startsWith(github.ref, 'refs/tags/v') && 90 || 30 }}

    # === Downstream images ===
    # Per ADR-018: gnunix-minimal is the release-dependency anchor.
    # Downstream layers fetch it, they do not rebuild it.

  build-minimal:
    needs: [meta, finalize]
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 30
    if: |
      github.event_name != 'workflow_dispatch' ||
      contains(github.event.inputs.images, 'gnunix-minimal')
    steps:
       - uses: actions/checkout@v4
       - name: Download base image
         uses: actions/download-artifact@v4
         with:
          name: gnunix-base-${{ needs.meta.outputs.arch }}-${{ needs.meta.outputs.version }}
          path: cache/artifacts/
       - name: Compute Nix store cache key
         id: nixkey
         run: |
          set -eu
          VER="${{ needs.meta.outputs.version }}"
            # flake.lock pins nixpkgs to one revision, so it alone decides
            # which store paths `nix build` has to produce. flake.nix and
            # nix/** deliberately do NOT key this cache: the Nix store is
            # addressed by derivation hash and is purely additive, so a store
            # restored from an older profile definition can only ever be
            # MISSING paths -- nix then builds or substitutes them. It cannot
            # serve a wrong one. That is the opposite of the LFS tree, whose
            # .done markers make a stale restore skip real work.
          LOCK=$(sha256sum flake.lock 2>/dev/null | awk '{print $1}')
          LOCK=${LOCK:-nolock}
          echo "key=nix-store-minimal-${VER}-${LOCK}" >> "$GITHUB_OUTPUT"
            # No restore-keys. This is the first job in the chain to use
            # Nix, so there is no predecessor to inherit from, and a
            # `nix-store-minimal-${VER}-` self-prefix fallback is exactly the
            # shape that poisoned main in #146.
          echo "restore=" >> "$GITHUB_OUTPUT"
       - name: Restore Nix store cache
         id: nixcache
         uses: actions/cache/restore@v4
         with:
          key: ${{ steps.nixkey.outputs.key }}
          restore-keys: ${{ steps.nixkey.outputs.restore }}
            # A workspace tarball, not /nix itself. Same constraint as the
            # LFS stages (scripts/ci-lfs-cache.sh): actions/cache runs as the
            # unprivileged `runner` user, so it can neither write root-owned
            # /nix nor preserve store-path ownership on the way back.
          path: cache/nix-store.tzst
       - name: Provide Nix
         run: |
          set -eu
            # 1. Unpack a cached /nix, if the restore found one. Root does the
            #    extraction so ownership survives the round trip.
          if [ -f cache/nix-store.tzst ]; then
            sudo tar --use-compress-program=unzstd -xf cache/nix-store.tzst -C /
          fi
          NIX_VER=$(jq -r .nix.binary_version tools/manifest.json)
          set -- /nix/store/*-nix-"$NIX_VER"/bin/nix
          NIX_BIN=$1
            # 2. Install only if the cache did not already provide it.
            #
            #    Pinned to tools/manifest.json .nix.binary_url -- the exact
            #    tarball gnunix-minimal installs into the image, verified
            #    against .nix.binary_sha256. Version parity is not cosmetic:
            #    `nix copy --no-check-sigs --to "$MNT"` writes a store that
            #    the image's own nix reads back, and the store DB schema is
            #    version-bound. A floating installer (cachix/install-nix-action
            #    defaults to whatever is current) would put a newer nix on the
            #    runner than the one in the image, which is how you get a
            #    store the target cannot open.
          if [ ! -x "$NIX_BIN" ]; then
            URL=$(jq -r .nix.binary_url tools/manifest.json)
            SHA=$(jq -r .nix.binary_sha256 tools/manifest.json)
            curl -fsSL --retry 3 -o /tmp/nix.tar.xz "$URL"
            echo "$SHA  /tmp/nix.tar.xz" | sha256sum -c -
            mkdir -p /tmp/nix-unpack
            tar -xJf /tmp/nix.tar.xz -C /tmp/nix-unpack
            set -- /tmp/nix-unpack/nix-"$NIX_VER"-*
            UNPACK=$1
              # The tarball's own ./install is skipped on purpose: it is
              # interactive about an existing /nix, edits root's shell
              # profile, and branches on daemon-vs-single-user. These two
              # lines are what it does underneath -- copy the closure in,
              # then register it in the store DB.
            sudo mkdir -p /nix/store /nix/var/nix
            sudo cp -a "$UNPACK"/store/* /nix/store/
            set -- /nix/store/*-nix-"$NIX_VER"/bin/nix
            NIX_BIN=$1
              # root does the redirect too: the store DB it writes is
              # root-owned, and `sudo cmd < file` would open .reginfo as the
              # runner user instead (SC2024).
            sudo sh -c 'exec "$1" --load-db < "$2"' _ \
                "${NIX_BIN%/nix}/nix-store" "$UNPACK/.reginfo"
          fi
            # 3. sudo resets PATH to secure_path, and the image build scripts
            #    are invoked as `sudo bash images/.../build.sh`. /usr/local/bin
            #    is on secure_path; a store path is not. Re-linked on every run
            #    because these live outside /nix and so are not in the cache.
          for t in nix nix-store nix-env nix-build nix-shell; do
            sudo ln -sf "${NIX_BIN%/nix}/$t" "/usr/local/bin/$t"
          done
            # 4. The build scripts call `nix build .#<profile>`, which needs
            #    both experimental features. build-users-group is emptied on
            #    purpose: this is a single-user root install on a throwaway
            #    runner with no nixbld1..32, and a group naming users that do
            #    not exist fails every build. The IMAGE keeps the multi-user
            #    setup ADR-003 defines; this file is the runner's, not its.
          sudo mkdir -p /etc/nix
          printf '%s\n' \
              'experimental-features = nix-command flakes' \
              'build-users-group =' \
              'max-jobs = auto' \
              | sudo tee /etc/nix/nix.conf >/dev/null
          sudo nix --version
       - name: Build gnunix-minimal
         run: |
          sudo bash images/gnunix-minimal/build.sh --ci
       - name: Pack the Nix store
         id: nixpack
         if: steps.nixcache.outputs.cache-hit != 'true'
         run: |
          set -eu
          mkdir -p cache
          sudo tar --use-compress-program='zstd -3 -T0' -cf cache/nix-store.tzst -C / nix
          sudo chown "$(id -u):$(id -g)" cache/nix-store.tzst
          ls -lh cache/nix-store.tzst
            # GitHub evicts caches LRU against a 10 GB per-REPOSITORY budget,
            # and the four LFS stage caches already hold most of it. Those
            # cost hours to rebuild; this one costs minutes off
            # cache.nixos.org. So refuse to save a store large enough to
            # evict them -- a missing Nix cache is slow, a missing LFS cache
            # is a rebuild of the whole toolchain.
          SZ=$(stat -c %s cache/nix-store.tzst)
          if [ "$SZ" -gt $((1500 * 1024 * 1024)) ]; then
            echo "store cache is $((SZ / 1024 / 1024)) MB, over the 1500 MB budget - not saving"
            echo "save=false" >> "$GITHUB_OUTPUT"
          else
            echo "save=true" >> "$GITHUB_OUTPUT"
          fi
       - name: Save Nix store cache
         if: steps.nixcache.outputs.cache-hit != 'true' && steps.nixpack.outputs.save == 'true'
         uses: actions/cache/save@v4
         with:
          key: ${{ steps.nixkey.outputs.key }}
          path: cache/nix-store.tzst
       - name: Compress + upload
         run: |
          set -eu
          VER="${{ needs.meta.outputs.version }}"
          ARCH="${{ needs.meta.outputs.arch }}"
          OUT="$REPO_ROOT/cache/artifacts"
          mkdir -p "$OUT"
          zstd -10 -f -k "$OUT/gnunix-minimal-${ARCH}-${VER}.img" \
              -o "$OUT/gnunix-minimal-${ARCH}-${VER}.img.zst"
       - name: Upload minimal artifact
         uses: actions/upload-artifact@v4
         with:
          name: gnunix-minimal-${{ needs.meta.outputs.arch }}-${{ needs.meta.outputs.version }}
          path: cache/artifacts/gnunix-minimal-${{ needs.meta.outputs.arch }}-${{ needs.meta.outputs.version }}.img.zst
          if-no-files-found: error
          retention-days: ${{ startsWith(github.ref, 'refs/tags/v') && 90 || 30 }}

  build-desktop:
    needs: [meta, build-minimal]
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 30
    if: |
      github.event_name != 'workflow_dispatch' ||
      contains(github.event.inputs.images, 'gnunix-desktop')
    steps:
       - uses: actions/checkout@v4
       - name: Download minimal image
         uses: actions/download-artifact@v4
         with:
          name: gnunix-minimal-${{ needs.meta.outputs.arch }}-${{ needs.meta.outputs.version }}
          path: cache/artifacts/
       - name: Compute Nix store cache key
         id: nixkey
         run: |
          set -eu
          VER="${{ needs.meta.outputs.version }}"
            # flake.lock pins nixpkgs to one revision, so it alone decides
            # which store paths `nix build` has to produce. flake.nix and
            # nix/** deliberately do NOT key this cache: the Nix store is
            # addressed by derivation hash and is purely additive, so a store
            # restored from an older profile definition can only ever be
            # MISSING paths -- nix then builds or substitutes them. It cannot
            # serve a wrong one. That is the opposite of the LFS tree, whose
            # .done markers make a stale restore skip real work.
          LOCK=$(sha256sum flake.lock 2>/dev/null | awk '{print $1}')
          LOCK=${LOCK:-nolock}
          echo "key=nix-store-desktop-${VER}-${LOCK}" >> "$GITHUB_OUTPUT"
            # Fall back ONLY to the predecessor job, never to an older
            # build of this same job's key. The fallback carries the FULL
            # lock hash, not a `nix-store-minimal-${VER}-` prefix, so it can
            # never match a store built against a different nixpkgs
            # revision -- and never a previous run of this job. That is the
            # shape that poisoned main in #146.
          echo "restore=nix-store-minimal-${VER}-${LOCK}" >> "$GITHUB_OUTPUT"
       - name: Restore Nix store cache
         id: nixcache
         uses: actions/cache/restore@v4
         with:
          key: ${{ steps.nixkey.outputs.key }}
          restore-keys: ${{ steps.nixkey.outputs.restore }}
            # A workspace tarball, not /nix itself. Same constraint as the
            # LFS stages (scripts/ci-lfs-cache.sh): actions/cache runs as the
            # unprivileged `runner` user, so it can neither write root-owned
            # /nix nor preserve store-path ownership on the way back.
          path: cache/nix-store.tzst
       - name: Provide Nix
         run: |
          set -eu
            # 1. Unpack a cached /nix, if the restore found one. Root does the
            #    extraction so ownership survives the round trip.
          if [ -f cache/nix-store.tzst ]; then
            sudo tar --use-compress-program=unzstd -xf cache/nix-store.tzst -C /
          fi
          NIX_VER=$(jq -r .nix.binary_version tools/manifest.json)
          set -- /nix/store/*-nix-"$NIX_VER"/bin/nix
          NIX_BIN=$1
            # 2. Install only if the cache did not already provide it.
            #
            #    Pinned to tools/manifest.json .nix.binary_url -- the exact
            #    tarball gnunix-minimal installs into the image, verified
            #    against .nix.binary_sha256. Version parity is not cosmetic:
            #    `nix copy --no-check-sigs --to "$MNT"` writes a store that
            #    the image's own nix reads back, and the store DB schema is
            #    version-bound. A floating installer (cachix/install-nix-action
            #    defaults to whatever is current) would put a newer nix on the
            #    runner than the one in the image, which is how you get a
            #    store the target cannot open.
          if [ ! -x "$NIX_BIN" ]; then
            URL=$(jq -r .nix.binary_url tools/manifest.json)
            SHA=$(jq -r .nix.binary_sha256 tools/manifest.json)
            curl -fsSL --retry 3 -o /tmp/nix.tar.xz "$URL"
            echo "$SHA  /tmp/nix.tar.xz" | sha256sum -c -
            mkdir -p /tmp/nix-unpack
            tar -xJf /tmp/nix.tar.xz -C /tmp/nix-unpack
            set -- /tmp/nix-unpack/nix-"$NIX_VER"-*
            UNPACK=$1
              # The tarball's own ./install is skipped on purpose: it is
              # interactive about an existing /nix, edits root's shell
              # profile, and branches on daemon-vs-single-user. These two
              # lines are what it does underneath -- copy the closure in,
              # then register it in the store DB.
            sudo mkdir -p /nix/store /nix/var/nix
            sudo cp -a "$UNPACK"/store/* /nix/store/
            set -- /nix/store/*-nix-"$NIX_VER"/bin/nix
            NIX_BIN=$1
              # root does the redirect too: the store DB it writes is
              # root-owned, and `sudo cmd < file` would open .reginfo as the
              # runner user instead (SC2024).
            sudo sh -c 'exec "$1" --load-db < "$2"' _ \
                "${NIX_BIN%/nix}/nix-store" "$UNPACK/.reginfo"
          fi
            # 3. sudo resets PATH to secure_path, and the image build scripts
            #    are invoked as `sudo bash images/.../build.sh`. /usr/local/bin
            #    is on secure_path; a store path is not. Re-linked on every run
            #    because these live outside /nix and so are not in the cache.
          for t in nix nix-store nix-env nix-build nix-shell; do
            sudo ln -sf "${NIX_BIN%/nix}/$t" "/usr/local/bin/$t"
          done
            # 4. The build scripts call `nix build .#<profile>`, which needs
            #    both experimental features. build-users-group is emptied on
            #    purpose: this is a single-user root install on a throwaway
            #    runner with no nixbld1..32, and a group naming users that do
            #    not exist fails every build. The IMAGE keeps the multi-user
            #    setup ADR-003 defines; this file is the runner's, not its.
          sudo mkdir -p /etc/nix
          printf '%s\n' \
              'experimental-features = nix-command flakes' \
              'build-users-group =' \
              'max-jobs = auto' \
              | sudo tee /etc/nix/nix.conf >/dev/null
          sudo nix --version
       - name: Build gnunix-desktop
         run: |
          sudo bash images/gnunix-desktop/build.sh --ci
       - name: Pack the Nix store
         id: nixpack
         if: steps.nixcache.outputs.cache-hit != 'true'
         run: |
          set -eu
          mkdir -p cache
          sudo tar --use-compress-program='zstd -3 -T0' -cf cache/nix-store.tzst -C / nix
          sudo chown "$(id -u):$(id -g)" cache/nix-store.tzst
          ls -lh cache/nix-store.tzst
            # GitHub evicts caches LRU against a 10 GB per-REPOSITORY budget,
            # and the four LFS stage caches already hold most of it. Those
            # cost hours to rebuild; this one costs minutes off
            # cache.nixos.org. So refuse to save a store large enough to
            # evict them -- a missing Nix cache is slow, a missing LFS cache
            # is a rebuild of the whole toolchain.
          SZ=$(stat -c %s cache/nix-store.tzst)
          if [ "$SZ" -gt $((1500 * 1024 * 1024)) ]; then
            echo "store cache is $((SZ / 1024 / 1024)) MB, over the 1500 MB budget - not saving"
            echo "save=false" >> "$GITHUB_OUTPUT"
          else
            echo "save=true" >> "$GITHUB_OUTPUT"
          fi
       - name: Save Nix store cache
         if: steps.nixcache.outputs.cache-hit != 'true' && steps.nixpack.outputs.save == 'true'
         uses: actions/cache/save@v4
         with:
          key: ${{ steps.nixkey.outputs.key }}
          path: cache/nix-store.tzst
       - name: Compress + upload
         run: |
          set -eu
          VER="${{ needs.meta.outputs.version }}"
          ARCH="${{ needs.meta.outputs.arch }}"
          OUT="$REPO_ROOT/cache/artifacts"
          mkdir -p "$OUT"
          zstd -10 -f -k "$OUT/gnunix-desktop-${ARCH}-${VER}.img" \
              -o "$OUT/gnunix-desktop-${ARCH}-${VER}.img.zst"
       - name: Upload desktop artifact
         uses: actions/upload-artifact@v4
         with:
          name: gnunix-desktop-${{ needs.meta.outputs.arch }}-${{ needs.meta.outputs.version }}
          path: cache/artifacts/gnunix-desktop-${{ needs.meta.outputs.arch }}-${{ needs.meta.outputs.version }}.img.zst
          if-no-files-found: error
          retention-days: ${{ startsWith(github.ref, 'refs/tags/v') && 90 || 30 }}

