            cache/vms/**/qemu.log
          if-no-files-found: ignore
          retention-days: 7

    # === Package matrix ===
    # Per ADR-018: produce the published artifact forms.

  package:
    # Must wait for the images it repackages: `needs: meta` alone let this
    # job start immediately, so download-artifact raced the build jobs.
    needs: [meta, build-minimal, build-desktop]
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 15
    strategy:
      matrix:
        include:
           - image: gnunix-minimal
             arch: aarch64
             platform: generic-uefi
             output_format: img.zst
           - image: gnunix-desktop
             arch: aarch64
             platform: generic-uefi
             output_format: img.zst
    steps:
       - uses: actions/checkout@v4
       - name: Download image
         uses: actions/download-artifact@v4
         with:
          name: ${{ matrix.image }}-${{ matrix.arch }}-${{ needs.meta.outputs.version }}
          path: cache/artifacts/
       - name: Decompress to raw .img
         run: |
          set -eu
            # tools/package/to-img-zst.sh reads the RAW disk image at
            # cache/artifacts/<image>-<arch>-<ver>.img; the build jobs
            # publish the compressed form, so expand it here.
          VER="${{ needs.meta.outputs.version }}"
          ARCH="${{ matrix.arch }}"
          SRC="cache/artifacts/${{ matrix.image }}-${ARCH}-${VER}"
          zstd -d -f "${SRC}.img.zst" -o "${SRC}.img"
       - name: Package
         run: |
          set -eu
          tools/package.sh "${{ matrix.image }}" \
              --arch=${{ matrix.arch }} \
              --platform=${{ matrix.platform }} \
              --as=${{ matrix.output_format }}
       - name: Upload package artifact
         uses: actions/upload-artifact@v4
         with:
          name: package-${{ matrix.image }}-${{ matrix.arch }}-${{ matrix.platform }}
            # Narrow to the packaged form only. Globbing the whole
            # cache/artifacts/ dir also swept up the decompressed raw
            # .img (multi-GB) and the downloaded input artifact.
          path: cache/artifacts/${{ matrix.image }}-${{ matrix.arch }}-${{ needs.meta.outputs.version }}.${{ matrix.output_format }}
          if-no-files-found: error
          retention-days: ${{ startsWith(github.ref, 'refs/tags/v') && 90 || 30 }}
