    # === Smoke tests ===
    # Per ADR-016 / ADR-021: tests run on `ubuntu-22.04-arm` via
    # qemu+KVM through `scripts/vm-helpers.sh`.

  test-base:
    needs: [meta, finalize]
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 45   # TCG: base boots in ~15s measured; headroom for desktop
    steps:
       - uses: actions/checkout@v4
       - name: Download base image
         uses: actions/download-artifact@v4
         with:
          name: gnunix-base-${{ needs.meta.outputs.arch }}-${{ needs.meta.outputs.version }}
          path: cache/artifacts/
       - name: Install qemu and EFI firmware
         run: |
          set -eu
            # No /dev/kvm on hosted arm64 runners, so the guest runs under
            # TCG. qemu-efi-aarch64 supplies /usr/share/AAVMF, which the
            # image needs to boot the way it does on hardware: UEFI -> GRUB.
          sudo apt-get update -qq
            # ipxe-qemu supplies efi-virtio.rom, which virtio-net-pci
            # refuses to start without. It is only a Recommends of
            # qemu-system-arm, so --no-install-recommends drops it.
          sudo apt-get install -y --no-install-recommends \
              qemu-system-arm qemu-utils qemu-efi-aarch64 ipxe-qemu
       - name: Boot smoke test
         run: |
          set -eu
          VER="${{ needs.meta.outputs.version }}"
          ARCH="${{ needs.meta.outputs.arch }}"
          zstd -d -c "cache/artifacts/gnunix-base-${ARCH}-${VER}.img.zst" \
              > cache/artifacts/base-test.img
            # Pass the IMAGE PATH, not a VM name: validate-boot.sh selects
            # its qemu path on the argument being a file. It previously got
            # a name, took the Tart branch, and waited on a VM that had
            # never been created.
          bash tests/base/boot-smoke.sh cache/artifacts/base-test.img
       - name: Upload guest console on failure
         if: failure()
         uses: actions/upload-artifact@v4
         with:
          name: console-test-base-${{ needs.meta.outputs.version }}
          path: |
            cache/vms/**/console.log
            cache/vms/**/qemu.log
          if-no-files-found: ignore
          retention-days: 7

