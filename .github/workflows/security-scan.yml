# CVE scan against NVD API 2.0 — detection + alerting only.
#
# Parses tools/manifest.json, resolves pinned packages through
# tools/cpe-map.json, queries NVD per package (virtualMatchString),
# filters by CVSS >= 7.0 (HIGH/CRITICAL).
#
# If critical CVEs found: opens one consolidated labeled issue per
# scan run, titled `CVE Report - <ISO-timestamp>`, containing a table
# of all findings. Deduped by exact title across open and closed
# issues. No image rebuild is triggered from here — a rebuild from
# unchanged pins would emit a bit-identical vulnerable image.
# Remediation is a pin bump via Renovate, which flows through the
# existing v* tag -> build.yml pipeline.
#
# If no CVEs: silent exit.
#
# Rate limiting: unauthenticated NVD allows 5 requests / 30 s, so the
# script sleeps ~7 s between queries (~64 packages = ~8 min); the
# optional NVD_API_KEY secret raises the limit (~1 s sleep). HTTP
# 429/503 responses and network failures are retried with backoff. A
# failed scan fails this job loudly and creates no issues.
#
# Trigger:
#   schedule: daily at 06:00 UTC
#   push: tools/manifest.json modified (every pin bump is CVE-verified)
#   workflow_dispatch: manual trigger

name: Security scan

on:
  schedule:
    - cron: "0 6 * * *"
  push:
    paths:
      - tools/manifest.json
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: security-scan
  cancel-in-progress: false

jobs:
  cve-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Scan manifest against NVD
        id: scan
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: bash tools/security-scan.sh

      - name: Open consolidated CVE report issue
        if: steps.scan.outputs.cves != ''
        uses: actions/github-script@v7
        with:
          script: |
            const labels = ['security', 'auto-triggered'];
            const findings = (process.env.FINDINGS_TSV || '')
              .split('\n')
              .filter(l => l.trim() !== '');
            if (findings.length === 0) {
              core.warning('cves=true but FINDINGS_TSV is empty');
              return;
            }

            // Build a timestamped title for this scan run.
            const now = new Date().toISOString().replace(/\.\d{3}Z$/, 'Z');
            const title = `CVE Report - ${now}`;

            // Dedup: skip if an issue with this exact title exists.
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              labels: labels.join(','),
              per_page: 100,
            });
            const existing = issues.find(i => i.title === title);
            if (existing) {
              core.info(`Report issue already exists: #${existing.number}`);
              return;
            }

            // Build the issue body with a table of all findings.
            const rows = [];
            for (const line of findings) {
              const [cveId, pkg, version, score, severity, url] =
                line.split('\t');
              if (!cveId || !pkg || !version || !score || !url) {
                core.warning(`Skipping malformed finding line: ${line}`);
                continue;
              }
              const cols = [
                cveId, pkg, version,
                score, severity,
                `[link](${url})`,
              ];
              rows.push('| ' + cols.join(' | ') + ' |');
            }

            const body = [
              '## CVE Scan Report',
              '',
              `Scan timestamp: ${now}`,
              `Total findings: ${rows.length}`,
              '',
              '| CVE | Package | Version | CVSS | Severity | Reference |',
              '|-----|---------|---------|------|----------|-----------|',
              ...rows,
              '',
              '---',
              '_Auto-detected by [security-scan.yml]' +
                '(.github/workflows/security-scan.yml). Remediate by' +
                ' bumping the affected pins in `tools/manifest.json`' +
                ' (Renovate PR -> merge -> v* tag -> build.yml)._',
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              labels,
              body,
            });
